<svg xmlns="http://www.w3.org/2000/svg" width="7in" height="1.25in" viewBox="0 0 1008 180"><defs><marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 z" fill="#222"/></marker></defs><g font-family="Arial" fill="#111"><text x="12" y="24" font-size="17" font-weight="normal" text-anchor="start">Optional far-only gate</text><text x="996" y="24" font-size="15" font-weight="normal" text-anchor="end">Inactive by default</text><rect x="12" y="48" width="181" height="58" fill="white" stroke="#222" stroke-width="1.15"/><text x="102.5" y="72.0" font-size="16" font-weight="normal" text-anchor="middle">Prefill far proxy</text><text x="102.5" y="92.0" font-size="16" font-weight="normal" text-anchor="middle">per input / layer</text><polyline points="193,77 223,77" fill="none" stroke="#222" stroke-width="1.2" marker-end="url(#a)"/><rect x="223" y="48" width="161" height="58" fill="white" stroke="#222" stroke-width="1.15"/><text x="303.5" y="72.0" font-size="16" font-weight="normal" text-anchor="middle">Threshold → D′</text><text x="303.5" y="92.0" font-size="16" font-weight="normal" text-anchor="middle">freeze for decode</text><polyline points="384,77 417,77 417,54 449,54" fill="none" stroke="#222" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#a)"/><polyline points="417,77 417,122 449,122" fill="none" stroke="#222" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#a)"/><rect x="449" y="34" width="165" height="40" fill="white" stroke="#222" stroke-width="1.15"/><text x="531.5" y="59.0" font-size="16" font-weight="normal" text-anchor="middle">ON: retain far</text><rect x="449" y="102" width="165" height="40" fill="white" stroke="#222" stroke-width="1.15"/><text x="531.5" y="127.0" font-size="16" font-weight="normal" text-anchor="middle">OFF: no far quota</text><polyline points="614,54 649,54" fill="none" stroke="#222" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#a)"/><text x="663" y="60" font-size="16" font-weight="normal" text-anchor="start">Far L1 + L2 active</text><polyline points="614,122 649,122" fill="none" stroke="#222" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#a)"/><text x="663" y="116" font-size="16" font-weight="normal" text-anchor="start">No far competition; near L2 refill</text><text x="663" y="138" font-size="14" font-weight="normal" text-anchor="start">boundary pages may still be scored</text><text x="12" y="169" font-size="14" font-weight="normal" text-anchor="start">Dashed arrows: control. Prefill does not bound decode error.</text></g></svg>